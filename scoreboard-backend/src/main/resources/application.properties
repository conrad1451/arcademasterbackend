# --- Server ---
server.port=8080

# --- MySQL connection ---
# Create the database first, e.g.: CREATE DATABASE scoreboard;
spring.datasource.url=jdbc:mysql://localhost:3306/scoreboard?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" will auto-create/alter the "scores" table on startup - fine for dev,
# switch to a migration tool (Flyway/Liquibase) + "validate" for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# CHQ: line below is no longer needed since Hibernate is automatically detecting the database type
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# CHQ: Gemini AI: Add these lines to stop Hibernate from forcing a connection at build-time
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
