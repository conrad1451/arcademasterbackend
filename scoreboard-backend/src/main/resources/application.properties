# --- Server ---
server.port=8080

# --- MySQL connection ---
# CHQ: Gemini AI: This syntax tells Spring to use the DB_URL env var from Render.
# If DB_URL is missing (like when running locally), it falls back to localhost.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scoreboard?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}

# Pulls DB_USER from Render env, defaults to 'root' locally
spring.datasource.username=${DB_USER:root}

# Pulls DB_PASSWORD from Render env, defaults to 'changeme' locally
spring.datasource.password=${DB_PASSWORD:changeme}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" will auto-create/alter the "scores" table on startup - fine for dev,
# switch to a migration tool (Flyway/Liquibase) + "validate" for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# CHQ: line below is no longer needed since Hibernate is automatically detecting the database type
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# CHQ: Gemini AI: Add these lines to stop Hibernate from forcing a connection at build-time
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
